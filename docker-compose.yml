version: '3.9'
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - PORT=4000
      - MONGO_URI=mongodb://root:example@mongo:27017/?authSource=admin
      - DATABASE_NAME=wiki
    ports:
      - '4000:4000'
    volumes:
      - .:/usr/src/app:cached

volumes:
  mongo-data:
